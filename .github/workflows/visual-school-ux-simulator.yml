name: School Inbox UX Simulator Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - codex/main-school-ux-99
    paths:
      - "apps/orbit-voice-ios/**"
      - ".github/workflows/visual-school-ux-simulator.yml"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Build Debug simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/orbit-voice-ios/VoiceAgent.xcodeproj \
            -scheme VoiceAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbit-school-ux-simulator" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            build

      - name: Capture compact Inbox and attachment Detail fixtures
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 12/ { print $2; exit }')
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          fi
          test -n "$device"
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/orbit-school-ux-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          test -d "$app"
          xcrun simctl install "$device" "$app"
          output="$RUNNER_TEMP/orbit-school-ux-screenshots"
          mkdir -p "$output"
          xcrun simctl launch "$device" net.opik.orbit.voice --orbit-school-inbox-fixture
          sleep 3
          xcrun simctl io "$device" screenshot "$output/school-inbox.png"
          xcrun simctl terminate "$device" net.opik.orbit.voice || true
          xcrun simctl launch "$device" net.opik.orbit.voice --orbit-school-detail-fixture
          sleep 3
          xcrun simctl io "$device" screenshot "$output/school-letter-detail.png"
          xcrun simctl terminate "$device" net.opik.orbit.voice || true
          xcrun simctl launch "$device" net.opik.orbit.voice --orbit-school-detail-actions-fixture
          sleep 3
          xcrun simctl io "$device" screenshot "$output/school-letter-actions.png"

      - uses: actions/upload-artifact@v4
        with:
          name: School-Inbox-UX-simulator-screenshots
          path: ${{ runner.temp }}/orbit-school-ux-screenshots
          retention-days: 7
          if-no-files-found: error
