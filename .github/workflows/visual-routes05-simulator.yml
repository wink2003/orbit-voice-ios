name: ROUTES 05 native simulator evidence

on:
  workflow_dispatch:
    inputs:
      targeted_only:
        description: 'Capture only Issue 17 targeted menu, exams and timetable evidence'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/routes05-batch1
      - codex/routes05-batch2-school-chat
      - codex/routes05-school-tasks-timetable
      - codex/routes05-inbox-fidelity-111
    paths:
      - "apps/orbit-voice-ios/**"
      - ".github/workflows/visual-routes05-simulator.yml"

permissions:
  contents: read

jobs:
  routes05-batch1:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select iPhone 12 simulator when available
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_line=$(xcrun simctl list devices available | awk '/iPhone 12[^()]*\(/ { print; exit }')
          if [ -z "$device_line" ]; then
            device_line=$(xcrun simctl list devices available | awk '/iPhone [^()]*\(/ { print; exit }')
          fi
          test -n "$device_line"
          udid=$(printf '%s\n' "$device_line" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          name=$(printf '%s\n' "$device_line" | sed -E 's/^    (.*) \([A-F0-9-]{36}\) \(.*/\1/')
          runtime=$(xcrun simctl list devices available | sed -n '1p' | tr -d '\r')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          printf 'Selected simulator: %s (%s)\n' "$name" "$udid"
          printf 'Available runtimes:\n%s\n' "$runtime"

      - name: Build Debug simulator app at checked-out commit
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/orbit-voice-ios/VoiceAgent.xcodeproj \
            -scheme VoiceAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbit-routes05-simulator" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            build | tee "$RUNNER_TEMP/routes05-xcodebuild.log"

      - name: Run existing unit tests
        run: |
          set -euo pipefail
          test_log="$RUNNER_TEMP/routes05-xcode-test.log"
          if xcodebuild -list -project apps/orbit-voice-ios/VoiceAgent.xcodeproj | grep -q 'VoiceAgentTests'; then
            xcodebuild \
              -project apps/orbit-voice-ios/VoiceAgent.xcodeproj \
              -scheme VoiceAgent \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}' \
              -derivedDataPath "$RUNNER_TEMP/orbit-routes05-tests" \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
              test | tee "$test_log"
          else
            printf 'No XCTest bundle is registered in VoiceAgent.xcodeproj; existing Tests/*.swift are not part of this scheme.\n' | tee "$test_log"
          fi

      - name: Capture light and dark native screenshots
        if: github.ref != 'refs/heads/codex/routes05-inbox-fidelity-111' && github.ref != 'refs/heads/codex/routes05-school-tasks-timetable'
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
          DEVICE_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          device="$DEVICE_UDID"
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/orbit-routes05-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          test -d "$app"
          xcrun simctl install "$device" "$app"
          out="$RUNNER_TEMP/orbit-routes05-screenshots"
          mkdir -p "$out"
          mkdir -p "$out/failures"
          printf 'simulator=%s\nudid=%s\ncommit=%s\n' "$DEVICE_NAME" "$device" "$GITHUB_SHA" > "$out/metadata.txt"
          xcrun simctl list runtimes >> "$out/metadata.txt"

          data_container=$(xcrun simctl get_app_container "$device" net.opik.orbit.voice data)
          ready_file="$data_container/Library/Caches/routes05-ready.json"
          wait_for_ready() {
            local route="$1" capture_id="$2"
            for _ in $(seq 1 30); do
              if test -s "$ready_file" && grep -Fq "\"route\":\"$route\"" "$ready_file" && grep -Fq "\"captureID\":\"$capture_id\"" "$ready_file"; then
                cp "$ready_file" "$out/$route-$capture_id.ready.json"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          if [ "${{ inputs.targeted_only }}" != "true" ]; then
          for screen in today chats school family; do
            for appearance in light dark; do
              xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
              sleep 2
              args="--routes05-$screen"
              if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
              printf 'Launching %s / %s with args: %s\n' "$screen" "$appearance" "$args"
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $args
              sleep 3
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$out/routes05-${screen}-${appearance}.png"
              test -s "$out/routes05-${screen}-${appearance}.png"

              printf 'Capturing bottom reachability for %s / %s\n' "$screen" "$appearance"
              xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
              bottom_args="--routes05-$screen --routes05-bottom"
              if [ "$appearance" = dark ]; then bottom_args="$bottom_args --routes05-dark"; fi
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $bottom_args
              # Bottom capture also exercises the debug scroll-to-bottom path;
              # allow the app and its fixture task to settle before taking evidence.
              sleep 8
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$out/routes05-${screen}-${appearance}-bottom.png"
              test -s "$out/routes05-${screen}-${appearance}-bottom.png"
            done
          done
          fi

          # Targeted Issue #17 evidence. These are DEBUG fixtures only: the
          # Family route opens the real More owner, Exams spans multiple weeks,
          # and Timetable is positioned at the rightmost horizontal column.
          for screen in family-menu exams timetable; do
            for appearance in light dark; do
              file="$out/routes05-${screen}-${appearance}-targeted.png"
              captured=false
              for attempt in 1 2 3; do
                capture_id="${GITHUB_RUN_ID}-${screen}-${appearance}-${attempt}"
                xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
                sleep 2
                args="--routes05-$screen --routes05-capture-id $capture_id --routes05-appearance $appearance"
                if [ "$screen" = "timetable" ]; then args="$args --routes05-scroll-horizontal"; fi
                if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
                launch_log="$out/failures/$screen-$appearance-attempt-$attempt.launch.log"
                if ! perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $args > "$launch_log" 2>&1; then continue; fi
                if ! wait_for_ready "$screen" "$capture_id"; then
                  printf 'readiness-timeout route=%s appearance=%s attempt=%s\n' "$screen" "$appearance" "$attempt" >> "$out/failures/diagnostics.log"
                  continue
                fi
                if ! perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$file"; then continue; fi
                if python3 .github/scripts/routes05_validate_png.py "$file" > "$out/$screen-$appearance.png-check" 2>&1; then
                  captured=true
                  break
                fi
                cp "$file" "$out/failures/$screen-$appearance-attempt-$attempt.png"
              done
              if [ "$captured" != true ]; then
                printf 'capture-failed route=%s appearance=%s\n' "$screen" "$appearance" >> "$out/failures/diagnostics.log"
                exit 1
              fi
            done
          done

      - name: Capture ROUTES 05 Inbox fidelity on native iOS
        if: github.ref == 'refs/heads/codex/routes05-inbox-fidelity-111'
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
          DEVICE_NAME: ${{ steps.simulator.outputs.name }}
        run: |
          set -euo pipefail
          device="$DEVICE_UDID"
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/orbit-routes05-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          test -d "$app"
          xcrun simctl install "$device" "$app"
          out="$RUNNER_TEMP/orbit-routes05-screenshots"
          mkdir -p "$out"
          printf 'simulator=%s\\nudid=%s\\ncommit=%s\\n' "$DEVICE_NAME" "$device" "$GITHUB_SHA" > "$out/metadata.txt"
          xcrun simctl list runtimes >> "$out/metadata.txt"
          for appearance in light dark; do
            xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
            args="--routes05-inbox"
            if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
            perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $args
            sleep 5
            file="$out/routes05-inbox-${appearance}.png"
            perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$file"
            test -s "$file"
          done

      - name: Capture Batch 2 secondary native screenshots
        if: github.ref == 'refs/heads/codex/routes05-batch2-school-chat'
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          device="$DEVICE_UDID"
          app="$RUNNER_TEMP/orbit-routes05-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          out="$RUNNER_TEMP/orbit-routes05-screenshots"
          for screen in conversation inbox letter tasks timetable exams schoolbrain schoolcalendar schoolsearch schooltimeline schoolbriefing schoolnotes schoolhistory; do
            for appearance in light dark; do
              xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
              args="--routes05-$screen"
              if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $args
              sleep 4
              file="$out/routes05-${screen}-${appearance}.png"
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$file"
              test -s "$file"
            done
          done

      - name: Capture remaining manifest routes
        if: github.ref == 'refs/heads/codex/routes05-batch2-school-chat'
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          device="$DEVICE_UDID"
          app="$RUNNER_TEMP/orbit-routes05-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          out="$RUNNER_TEMP/orbit-routes05-screenshots"
          for screen in calendar contacts memory voice familychat settings integrations memorydetail contactdetail actionconfirm admin profile notifications memoryimports unknown; do
            for appearance in light dark; do
              xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
              args="--routes05-$screen"
              if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
              perl -e 'alarm shift; exec @ARGV' 45 xcrun simctl launch "$device" net.opik.orbit.voice $args
              sleep 4
              file="$out/routes05-${screen}-${appearance}.png"
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$file"
              test -s "$file"
            done
          done

      - name: Capture targeted School Tasks and Timetable
        if: github.ref == 'refs/heads/codex/routes05-school-tasks-timetable'
        env:
          DEVICE_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          device="$DEVICE_UDID"
          app="$RUNNER_TEMP/orbit-routes05-simulator/Build/Products/Debug-iphonesimulator/VoiceAgent.app"
          out="$RUNNER_TEMP/orbit-routes05-screenshots"
          mkdir -p "$out"
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          for screen in tasks timetable; do
            for appearance in light dark; do
              xcrun simctl terminate "$device" net.opik.orbit.voice 2>/dev/null || true
              args="--routes05-$screen"
              if [ "$appearance" = dark ]; then args="$args --routes05-dark"; fi
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl launch "$device" net.opik.orbit.voice $args
              sleep 4
              file="$out/routes05-${screen}-${appearance}.png"
              perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl io "$device" screenshot "$file"
              test -s "$file"
            done
          done

      - name: Upload native screenshots, metadata and build logs
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-ROUTES05-native-evidence
          path: |
            ${{ runner.temp }}/orbit-routes05-screenshots/
            ${{ runner.temp }}/routes05-xcodebuild.log
            ${{ runner.temp }}/routes05-xcode-test.log
          retention-days: 14
          if-no-files-found: error
