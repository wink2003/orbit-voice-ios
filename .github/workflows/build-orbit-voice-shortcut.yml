name: Build Orbit Voice Shortcut

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-publish-unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Generate and validate unsigned shortcut
        run: |
          set -euo pipefail
          rm -rf artifacts/orbit-voice-shortcut
          mkdir -p artifacts/orbit-voice-shortcut
          python3 scripts/generate-orbit-voice-shortcut.py \
            --output "artifacts/orbit-voice-shortcut/Orbit Voice.shortcut"
          python3 scripts/validate-orbit-voice-shortcut.py \
            "artifacts/orbit-voice-shortcut/Orbit Voice.shortcut"
          test -s "artifacts/orbit-voice-shortcut/Orbit Voice.shortcut"
          python3 - "artifacts/orbit-voice-shortcut/Orbit Voice.shortcut" \
            > artifacts/orbit-voice-shortcut/validation-report.txt <<'PY'
          import hashlib
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          with path.open("rb") as handle:
              data = plistlib.load(handle)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"filename={path.name}")
          print(f"size_bytes={path.stat().st_size}")
          print(f"sha256={digest}")
          print(f"action_count={len(data['WFWorkflowActions'])}")
          print("signed=false")
          PY

      - name: Publish unsigned Shortcut artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Voice-Shortcut-Unsigned
          path: artifacts/orbit-voice-shortcut/Orbit Voice.shortcut
          if-no-files-found: error

      - name: Publish validation report
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Voice-Shortcut-Unsigned-Validation
          path: artifacts/orbit-voice-shortcut/validation-report.txt
          if-no-files-found: error

  try-apple-signing:
    needs: generate-and-publish-unsigned
    runs-on: macos-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download validated unsigned Shortcut
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Voice-Shortcut-Unsigned
          path: artifacts/orbit-voice-shortcut

      - name: Attempt Apple signing (optional)
        id: signing
        run: |
          set -u
          input="artifacts/orbit-voice-shortcut/Orbit Voice.shortcut"
          output="artifacts/orbit-voice-shortcut/Orbit Voice.signed.shortcut"
          help_file="artifacts/orbit-voice-shortcut/sign-help.txt"
          log_file="artifacts/orbit-voice-shortcut/sign.log"
          shortcuts help sign > "$help_file" 2>&1
          if ! grep -Eq -- '--mode' "$help_file" || ! grep -Eq -- 'anyone' "$help_file"; then
            printf '%s\n' 'signed=false' 'reason=unsupported_sign_syntax' > "$log_file"
          else
            set +e
            shortcuts sign --mode anyone --input "$input" --output "$output" > "$log_file" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] && [ -s "$output" ]; then
              printf '%s\n' 'signed=true' >> "$log_file"
            else
              printf '%s\n' 'signed=false' 'reason=apple_signing_unavailable' >> "$log_file"
              rm -f "$output"
            fi
          fi
          cat "$log_file"

      - name: Publish signing status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Voice-Shortcut-Signing-Status
          path: artifacts/orbit-voice-shortcut/sign.log
          if-no-files-found: error
