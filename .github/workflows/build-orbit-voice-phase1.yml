name: Build Orbit Voice Phase 1

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/orbit-voice-phase1/**"
      - ".github/workflows/build-orbit-voice-phase1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode project
        run: |
          set -o pipefail
          xcodebuild -project apps/orbit-voice-phase1/OrbitVoice.xcodeproj -list 2>&1 | tee "$RUNNER_TEMP/orbit-voice-phase1-list.log"
      - name: Build unsigned Orbit Voice Phase 1
        run: |
          set -o pipefail
          xcodebuild -project apps/orbit-voice-phase1/OrbitVoice.xcodeproj \
            -target OrbitVoice -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/orbit-voice-phase1-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            build 2>&1 | tee "$RUNNER_TEMP/orbit-voice-phase1-build.log"
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-voice-phase1-ipa/Payload"
          cp -R "$RUNNER_TEMP/orbit-voice-phase1-derived/Build/Products/Release-iphoneos/Orbit Voice.app" "$RUNNER_TEMP/orbit-voice-phase1-ipa/Payload/"
          cd "$RUNNER_TEMP/orbit-voice-phase1-ipa"
          zip -qry Orbit-Voice-Phase1.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Voice-Phase1-IPA
          path: ${{ runner.temp }}/orbit-voice-phase1-ipa/Orbit-Voice-Phase1.ipa
          retention-days: 7
