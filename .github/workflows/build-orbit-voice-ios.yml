name: Build Orbit Voice IPA

on:
  workflow_dispatch:
    inputs:
      derive_build_number:
        description: "Dry-run the derived build number on a non-release branch (never used by the release pipeline)"
        type: boolean
        default: false
  push:
    branches-ignore:
      - codex/interpreter-phase1-build-gate
    paths:
      - "apps/orbit-voice-ios/**"
      - ".github/workflows/build-orbit-voice-ios.yml"

permissions:
  contents: read

jobs:
  # Build-number scripts: hermetic python tests (cheap, ubuntu).  The release-branch build number is DERIVED in the build job
  # (published SideStore build + 1; owner decision 2026-11-12, replaces the manual bump PR); the canonical ipa-plan stays the authority.
  build-number-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build number scripts (monotonic check + derivation)
        working-directory: scripts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest test_check_build_monotonic test_derive_build_number

  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize Main Orbit icon
        run: |
          set -euo pipefail
          icon_dir="apps/orbit-voice-ios/VoiceAgent/Assets.xcassets/AppIcon.appiconset"
          /usr/bin/sips -s format png -z 1024 1024 \
            "$icon_dir/MainOrbitIcon.jpg" \
            --out "$icon_dir/App_store_1024_1x.png"
          rm "$icon_dir/MainOrbitIcon.jpg"

      - name: Derive build number (release branch only)
        id: buildnum
        if: github.ref == 'refs/heads/release/main-orbit' || inputs.derive_build_number == true
        run: |
          set -uo pipefail
          python3 scripts/derive_build_number.py \
            --project apps/orbit-voice-ios/VoiceAgent.xcodeproj/project.pbxproj | tee "$RUNNER_TEMP/build-number.json"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          n=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/build-number.json'))['buildNumber'])")
          echo "DERIVED_BUILD_NUMBER=$n"
          {
            echo '## Derived build number'
            echo "**$n** (published build + 1). Use this value as buildNumber in the release intent."
            echo '```json'
            cat "$RUNNER_TEMP/build-number.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned iOS application
        env:
          CPV_OVERRIDE: ${{ steps.buildnum.outputs.build_number && format('CURRENT_PROJECT_VERSION={0}', steps.buildnum.outputs.build_number) || '' }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086  (CPV_OVERRIDE is empty or a single KEY=VALUE word)
          xcodebuild \
            -project apps/orbit-voice-ios/VoiceAgent.xcodeproj \
            -scheme VoiceAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/orbit-derived-data" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            $CPV_OVERRIDE \
            build 2>&1 | tee "$RUNNER_TEMP/orbit-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Swift build errors'
              echo '```text'
              grep -E 'error:|warning:' "$RUNNER_TEMP/orbit-build.log" || tail -n 120 "$RUNNER_TEMP/orbit-build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Test codec fmtp privacy parser
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitCodecFmtpParser.swift \
            apps/orbit-voice-ios/Tests/OrbitCodecFmtpParserTests.swift \
            -o "$RUNNER_TEMP/orbit-codec-fmtp-tests"
          "$RUNNER_TEMP/orbit-codec-fmtp-tests"

      - name: Test Main chat formatting
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Chat/OrbitChatMarkdownFormatting.swift \
            apps/orbit-voice-ios/Tests/OrbitChatMarkdownFormattingTests.swift \
            -o "$RUNNER_TEMP/orbit-chat-formatting-tests"
          "$RUNNER_TEMP/orbit-chat-formatting-tests"

      - name: Test School event date decoding
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/SchoolDateDecoding.swift \
            apps/orbit-voice-ios/Tests/OrbitSchoolDateDecodingTests.swift \
            -o "$RUNNER_TEMP/orbit-school-date-tests"
          "$RUNNER_TEMP/orbit-school-date-tests"

      - name: Test School item translationStatus decoding
        run: |
          set -euo pipefail
          printf '%s\n' 'import Foundation' > "$RUNNER_TEMP/orbit-school-item-models.swift"
          awk '/^struct OrbitSchoolEvent/ { emit=1 } emit { print } /^struct OrbitSchoolItemsResponse/ { emit=0 }' \
            apps/orbit-voice-ios/VoiceAgent/Orbit/MainProductAPI.swift >> "$RUNNER_TEMP/orbit-school-item-models.swift"
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/SchoolDateDecoding.swift \
            "$RUNNER_TEMP/orbit-school-item-models.swift" \
            apps/orbit-voice-ios/Tests/OrbitSchoolItemTranslationStatusDecodingTests.swift \
            -o "$RUNNER_TEMP/orbit-school-item-status-tests"
          "$RUNNER_TEMP/orbit-school-item-status-tests"

      - name: Test Azure Speech admin stats decoding
        run: |
          set -euo pipefail
          printf '%s\n' 'import Foundation' > "$RUNNER_TEMP/orbit-azure-models.swift"
          awk '/^struct AzureSpeechStats/ { emit=1 } /^@MainActor final class ServerOverviewStore/ { emit=0 } emit { print }' \
            apps/orbit-voice-ios/VoiceAgent/Orbit/ServerOverview.swift >> "$RUNNER_TEMP/orbit-azure-models.swift"
          xcrun swiftc \
            "$RUNNER_TEMP/orbit-azure-models.swift" \
            apps/orbit-voice-ios/Tests/OrbitAzureSpeechStatsTests.swift \
            -o "$RUNNER_TEMP/orbit-azure-stats-tests"
          "$RUNNER_TEMP/orbit-azure-stats-tests"

      - name: Test Main timezone hint
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitTimezoneHint.swift \
            apps/orbit-voice-ios/Tests/OrbitTimezoneHintTests.swift \
            -o "$RUNNER_TEMP/orbit-timezone-hint-tests"
          "$RUNNER_TEMP/orbit-timezone-hint-tests"

      - name: Test School items decoding regression
        run: |
          set -euo pipefail
          xcrun swiftc apps/orbit-voice-ios/Tests/OrbitSchoolItemsDecodingRegressionTests.swift -o "$RUNNER_TEMP/orbit-school-items-decoding-tests"
          "$RUNNER_TEMP/orbit-school-items-decoding-tests"

      - name: Test School Brain request state
        run: |
          set -euo pipefail
          xcrun swiftc \
            -framework SwiftUI \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolBrainRequestState.swift \
            apps/orbit-voice-ios/Tests/SchoolBrainRequestStateTests.swift \
            -o "$RUNNER_TEMP/orbit-school-brain-request-state-tests"
          "$RUNNER_TEMP/orbit-school-brain-request-state-tests"

      - name: Test School Brain response decoding
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/SchoolBrainMessage.swift \
            apps/orbit-voice-ios/Tests/SchoolBrainMessageDecodingTests.swift \
            -o "$RUNNER_TEMP/orbit-school-brain-message-decoding-tests"
          "$RUNNER_TEMP/orbit-school-brain-message-decoding-tests"

      - name: Test School Brain chat model
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            apps/orbit-voice-ios/VoiceAgent/Orbit/SchoolBrainMessage.swift \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolBrainChatModel.swift \
            apps/orbit-voice-ios/Tests/SchoolBrainChatModelTests.swift \
            -o "$RUNNER_TEMP/orbit-school-brain-chat-model-tests"
          "$RUNNER_TEMP/orbit-school-brain-chat-model-tests"

      - name: Test School Brain Markdown rendering
        run: |
          set -euo pipefail
          xcrun swiftc \
            -parse-as-library \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolBrainMarkdown.swift \
            apps/orbit-voice-ios/Tests/SchoolBrainMarkdownTests.swift \
            -o "$RUNNER_TEMP/orbit-school-brain-markdown-tests"
          "$RUNNER_TEMP/orbit-school-brain-markdown-tests"

      - name: School Brain view layout contract
        run: |
          set -euo pipefail
          view=apps/orbit-voice-ios/VoiceAgent/App/SchoolBrainChatView.swift
          grep -q 'SchoolBrainMarkdownView(blocks:' "$view"
          grep -q 'SchoolBrainMarkdown.blocks(from:' "$view"
          grep -q 'safeAreaInset(edge: .bottom' "$view"
          grep -q 'Запитайте про школу…' "$view"
          grep -q 'textSelection(.enabled)' "$view"
          grep -q 'Джерела · ' "$view"
          grep -q 'novaDockTopY' "$view"
          ! grep -nE '\.offset\(|UIScreen|\.frame\(height: *[0-9]{3}' "$view"
          grep -q 'SchoolBrainView()' apps/orbit-voice-ios/VoiceAgent/App/SchoolHubViews.swift

      - name: Test Agent run reconciliation
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Chat/OrbitAgentRunMerge.swift \
            apps/orbit-voice-ios/Tests/OrbitAgentRunMergeTests.swift \
            -o "$RUNNER_TEMP/orbit-agent-run-merge-tests"
          "$RUNNER_TEMP/orbit-agent-run-merge-tests"

      - name: Test Main navigation
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/OrbitNavigation.swift \
            apps/orbit-voice-ios/Tests/OrbitNavigationTests.swift \
            -o "$RUNNER_TEMP/orbit-navigation-tests"
          "$RUNNER_TEMP/orbit-navigation-tests"

      - name: Test child-profile permissions model
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitPermissions.swift \
            apps/orbit-voice-ios/Tests/OrbitPermissionsTests.swift \
            -o "$RUNNER_TEMP/orbit-permissions-tests"
          "$RUNNER_TEMP/orbit-permissions-tests"

      - name: Test ROUTES 05 manifest mapping
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/Routes05RouteRegistry.swift \
            apps/orbit-voice-ios/Tests/Routes05RouteRegistryTests.swift \
            -o "$RUNNER_TEMP/routes05-route-registry-tests"
          "$RUNNER_TEMP/routes05-route-registry-tests"

      - name: Test Main app lock state
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitAppLockState.swift \
            apps/orbit-voice-ios/Tests/OrbitAppLockStateTests.swift \
            -o "$RUNNER_TEMP/orbit-app-lock-tests"
          "$RUNNER_TEMP/orbit-app-lock-tests"

      - name: Test Main account session state
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitAccountSessionState.swift \
            apps/orbit-voice-ios/Tests/OrbitAccountSessionStateTests.swift \
            -o "$RUNNER_TEMP/orbit-account-session-tests"
          "$RUNNER_TEMP/orbit-account-session-tests"

      - name: Test Main target filtering
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/OrbitTargetFiltering.swift \
            apps/orbit-voice-ios/Tests/OrbitTargetFilteringTests.swift \
            -o "$RUNNER_TEMP/orbit-target-filtering-tests"
          "$RUNNER_TEMP/orbit-target-filtering-tests"

      - name: Test source states
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/OrbitSourceState.swift \
            apps/orbit-voice-ios/Tests/OrbitSourceStateTests.swift \
            -o "$RUNNER_TEMP/orbit-source-state-tests"
          "$RUNNER_TEMP/orbit-source-state-tests"

      - name: Test Today logic
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/OrbitTodayLogic.swift \
            apps/orbit-voice-ios/Tests/OrbitTodayLogicTests.swift \
            -o "$RUNNER_TEMP/orbit-today-logic-tests"
          "$RUNNER_TEMP/orbit-today-logic-tests"

      - name: Test Calendar v2 logic
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/OrbitCalendarV2Logic.swift \
            apps/orbit-voice-ios/Tests/OrbitCalendarV2LogicTests.swift \
            -o "$RUNNER_TEMP/orbit-calendar-v2-logic-tests"
          "$RUNNER_TEMP/orbit-calendar-v2-logic-tests"

      - name: Test School Hub logic
        run: |
          set -euo pipefail
          # Compile the production v2 model declarations without pulling the
          # app's networking/authentication module graph into this focused test.
          printf '%s\n' 'import Foundation' > "$RUNNER_TEMP/orbit-school-hub-v2-models.swift"
          awk '
            /^private extension KeyedDecodingContainer/ { emit=1 }
            /^struct OrbitSchoolActionTask/ { emit=0 }
            emit { print }
          ' apps/orbit-voice-ios/VoiceAgent/Orbit/MainProductAPI.swift \
            >> "$RUNNER_TEMP/orbit-school-hub-v2-models.swift"
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Orbit/SchoolDateDecoding.swift \
            "$RUNNER_TEMP/orbit-school-hub-v2-models.swift" \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolHubLogic.swift \
            apps/orbit-voice-ios/Tests/SchoolHubLogicTests.swift \
            -o "$RUNNER_TEMP/orbit-school-hub-logic-tests"
          "$RUNNER_TEMP/orbit-school-hub-logic-tests"
          if grep -n "TabView\|\.tabItem" apps/orbit-voice-ios/VoiceAgent/App/SchoolHubViews.swift apps/orbit-voice-ios/VoiceAgent/App/SchoolViews.swift; then
            echo "School Hub must not add a second tab bar"; exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path("apps/orbit-voice-ios/VoiceAgent/App/SchoolHubViews.swift").read_text()
          helper = source.split("@ViewBuilder private func taskGroupView(", 1)[1].split("@ViewBuilder private func laterTaskGroup(", 1)[0]
          assert "if !tasks.isEmpty {" in helper, "Task groups must remain hidden when empty"
          assert "showsEmpty" not in helper, "Empty groups must not be force-shown"
          for title, section in (("Цей тиждень", "thisWeek"), ("Наступний тиждень", "nextWeek")):
              call = next(line for line in source.splitlines() if f'taskGroupView("{title}"' in line)
              assert f"tasks: sections.{section}" in call, f"{title} must use its grouped tasks"
              assert "completedCount:" in call, f"{title} must retain its completed/total count"
              assert "showsEmpty" not in call, f"{title} must not force an empty heading"
          PY

      - name: Test Admin health logic
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/AdminHealthLogic.swift \
            apps/orbit-voice-ios/Tests/AdminHealthLogicTests.swift \
            -o "$RUNNER_TEMP/orbit-admin-health-tests"
          "$RUNNER_TEMP/orbit-admin-health-tests"
      - name: Test School email logic
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolEmailLogic.swift \
            apps/orbit-voice-ios/Tests/SchoolEmailLogicTests.swift \
            -o "$RUNNER_TEMP/orbit-school-email-tests"
          "$RUNNER_TEMP/orbit-school-email-tests"
      - name: Test School task calendar model
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolHubLogic.swift \
            apps/orbit-voice-ios/VoiceAgent/App/SchoolTaskCalendarModel.swift \
            apps/orbit-voice-ios/Tests/SchoolTaskCalendarModelTests.swift \
            -o "$RUNNER_TEMP/orbit-school-task-calendar-tests"
          "$RUNNER_TEMP/orbit-school-task-calendar-tests"

      - name: Test School navigation ownership
        run: |
          set -euo pipefail
          school_hub="apps/orbit-voice-ios/VoiceAgent/App/SchoolHubViews.swift"
          grep -F 'SchoolInboxView(embeddedInNavigation: true, hubMode: true' "$school_hub"
          if grep -F 'case .inbox: SchoolInboxView()' "$school_hub"; then
            echo "School Inbox must not create a nested NavigationStack"; exit 1
          fi

      - name: Test chat presentation
        run: |
          set -euo pipefail
          xcrun swiftc \
            apps/orbit-voice-ios/VoiceAgent/Chat/OrbitChatPresentation.swift \
            apps/orbit-voice-ios/Tests/OrbitChatPresentationTests.swift \
            -o "$RUNNER_TEMP/orbit-chat-presentation-tests"
          "$RUNNER_TEMP/orbit-chat-presentation-tests"

      - name: Verify the built app carries the derived build number
        if: steps.buildnum.outputs.build_number != ''
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/orbit-derived-data/Build/Products/Release-iphoneos/VoiceAgent.app"
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          echo "Info.plist CFBundleVersion=$actual expected=${{ steps.buildnum.outputs.build_number }}"
          test "$actual" = "${{ steps.buildnum.outputs.build_number }}"

      - name: Package IPA for AltStore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-ipa/Payload"
          cp -R \
            "$RUNNER_TEMP/orbit-derived-data/Build/Products/Release-iphoneos/VoiceAgent.app" \
            "$RUNNER_TEMP/orbit-ipa/Payload/"
          cd "$RUNNER_TEMP/orbit-ipa"
          /usr/bin/zip -qry Orbit-Voice.ipa Payload

      - name: Upload Orbit Voice
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Voice-IPA
          path: ${{ runner.temp }}/orbit-ipa/Orbit-Voice.ipa
          retention-days: 7
          if-no-files-found: error
